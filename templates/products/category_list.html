{% extends 'base.html' %}
{% block title %}Categories | ShopEase{% endblock %}

{% block content %}
<div class="container py-5">
    <h2 class="section-title">All Categories</h2>
    <div class="row g-4">
        {% for cat in categories %}
        <div class="col-md-4 col-lg-3">
            <a href="{{ cat.get_absolute_url }}" class="text-decoration-none">
                <div class="category-card mb-2" style="height:180px;">
                    {% if cat.image %}<img src="{{ cat.image.url }}" alt="{{ cat.name }}">{% endif %}
                    <div class="overlay">{{ cat.name }}</div>
                </div>
            </a>
            <p class="text-center text-muted small">{{ cat.product_count }} products</p>
        </div>
        {% empty %}
        <p class="text-muted">No categories available yet.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
