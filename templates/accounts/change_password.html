{% extends 'base.html' %}
{% block title %}Change Password | ShopEase{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="border rounded-xl p-4">
                <h4 class="fw-bold mb-3"><i class="bi bi-key"></i> Change Password</h4>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Current Password</label>
                        {{ form.old_password }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        {{ form.new_password1 }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm New Password</label>
                        {{ form.new_password2 }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
