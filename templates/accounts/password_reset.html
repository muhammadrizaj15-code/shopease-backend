{% extends 'base.html' %}
{% block title %}Reset Password | ShopEase{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="border rounded-xl p-4 shadow-sm">
                <h3 class="fw-bold text-center mb-3"><i class="bi bi-shield-lock"></i> Reset Password</h3>
                <p class="text-muted small text-center mb-4">Enter your email address and we'll send you a link to reset your password.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        {{ form.email }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
                </form>
                <p class="text-center mt-3 small"><a href="{% url 'accounts:login' %}">Back to Login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
