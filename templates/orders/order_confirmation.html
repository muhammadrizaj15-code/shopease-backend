{% extends 'base.html' %}
{% block title %}Order Confirmed | ShopEase{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <i class="bi bi-check-circle-fill text-success" style="font-size:5rem;"></i>
    <h2 class="fw-bold mt-3">Thank You! Your Order is Confirmed</h2>
    <p class="text-muted">Order number: <strong>{{ order.order_number }}</strong></p>
    <p class="text-muted">A confirmation email will be sent to {{ order.email }}.</p>
    <div class="d-flex justify-content-center gap-3 mt-4">
        <a href="{% url 'orders:order_detail' order.order_number %}" class="btn btn-primary">View Order Details</a>
        <a href="{% url 'products:product_list' %}" class="btn btn-outline-secondary">Continue Shopping</a>
    </div>
</div>
{% endblock %}
