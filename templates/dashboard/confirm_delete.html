{% extends 'dashboard/base_dashboard.html' %}
{% block title %}Delete {{ type }} | ShopEase{% endblock %}

{% block dashboard_content %}
<div class="border rounded-xl p-4" style="max-width:500px;">
    <h4 class="fw-bold text-danger"><i class="bi bi-exclamation-triangle"></i> Delete {{ type }}</h4>
    <p>Are you sure you want to delete "<strong>{{ object }}</strong>"? This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
